# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    # CRAN currently serves its macOS arm64 binaries zstd compressed under a
    # .tgz name, which pkgdepends cannot extract, so pak fails to install the
    # dependencies before the package is ever checked. The leg is therefore
    # allowed to fail, so that a problem outside this repository does not turn
    # the whole run red and mail a failure for it. See
    # https://github.com/r-lib/pkgdepends/issues/485 and drop the flag together
    # with 'allow-failure' below once that is released.
    continue-on-error: ${{ matrix.config.allow-failure || false }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release', allow-failure: true}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      # The packages are taken from the public Posit Package Manager on every
      # platform, not only on Linux. CRAN serves its macOS arm64 binaries zstd
      # compressed under a .tgz name, which pkgdepends cannot extract, so pak
      # fails to install the dependencies there. This is the workaround the
      # maintainer of pkgdepends gives in
      # https://github.com/r-lib/pkgdepends/issues/485, and it can go back to
      # 'true' once that is released.
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: always

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
